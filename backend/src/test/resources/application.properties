spring.datasource.url=jdbc:h2:mem:secureops-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.sql.init.mode=never

security.jwt.secret=test-secret-key-that-is-long-enough-for-jwt-security-tests-123456
security.jwt.expiration=3600000

secureops.siem.url=http://localhost:9999
secureops.siem.token=test-token
secureops.siem.index=main
secureops.siem.sourcetype=secureops

spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=2
