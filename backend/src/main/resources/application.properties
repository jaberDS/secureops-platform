spring.datasource.url=jdbc:postgresql://localhost:15432/secureops
spring.datasource.username=secureops
spring.datasource.password=${SECUREOPS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=9000

security.jwt.secret=${SECUREOPS_JWT_SECRET}
security.jwt.expiration-ms=${SECUREOPS_JWT_EXPIRATION_MS:3600000}

security.password-reset.expiration-minutes=${SECUREOPS_PASSWORD_RESET_EXPIRATION_MINUTES:15}
security.password-reset.expose-token=${SECUREOPS_PASSWORD_RESET_EXPOSE_TOKEN:false}

logging.level.org.springframework.security=DEBUG


# --- SIEM / Splunk HEC ---
secureops.siem.url=${SPLUNK_HEC_URL:http://192.168.50.10:8088}
secureops.siem.token=${SPLUNK_HEC_TOKEN:CHANGE_ME}
secureops.siem.index=${SPLUNK_HEC_INDEX:main}
secureops.siem.sourcetype=${SPLUNK_HEC_SOURCETYPE:secureops}