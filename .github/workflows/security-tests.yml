name: SecureOps Security Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: secureops
          POSTGRES_USER: secureops
          POSTGRES_PASSWORD: secureops_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureops -d secureops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECUREOPS_DB_PASSWORD: secureops_ci_password
      SECUREOPS_JWT_SECRET: SecureOpsCISecurityTestSecret_2026_123456789
      SECUREOPS_JWT_EXPIRATION_MS: 3600000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Run security tests
        working-directory: backend
        run: mvn -B clean test
